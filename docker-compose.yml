version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: whodidit
    environment:
      POSTGRES_USER: whodidit
      POSTGRES_PASSWORD: whodidit
      POSTGRES_DB: whodidit_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: